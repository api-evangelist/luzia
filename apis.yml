name: Luzia
description: 'Luzia is a consumer-facing artificial intelligence assistant serving 85M+ users across
  web, iOS, Android, desktop, and WhatsApp, with a strong presence in Spanish- and Portuguese-speaking
  markets where it ranks as the #1 app in several countries. The free assistant offers AI chat, image
  generation, PDF understanding, web search, and an agentic "LuziClaw" task mode, with a Luzia+ premium
  subscription adding advanced reasoning, custom AI characters, and higher generation limits. Luzia is a
  portfolio company of Prosus Ventures. As of this enrichment pass, Luzia publishes no public developer
  API, developer portal, or documentation surface; this profile captures its public identity and
  domain-security posture.'
